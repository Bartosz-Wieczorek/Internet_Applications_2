App\Entity\Location:
    properties:
        city:
            - NotBlank: { groups: [create, edit] }
            - Length: { max: 255, groups: [create, edit] }
            - Length: { min: 3, groups: [create] }

        country:
            -   NotBlank: { groups: [ create, edit ] }
            -   Length: { exactly: 2, groups: [create, edit] }

        latitude:
            -   NotBlank: { groups: [ create, edit ] }
            -   Range: { min: -90, max: 90, groups: [create, edit]}

        longitude:
            -   NotBlank: { groups: [ create, edit ] }
            -   Range: { min: -180,max: 180, groups: [ create, edit ] }

App\Entity\Measurement:
    properties:
        location:
            - NotNull: { groups: [create, edit] }
        date:
            - NotNull: { groups: [create, edit] }
            - GreaterThanOrEqual: { value: today, groups: [create] }
        celsius:
            - NotBlank: { groups: [create, edit] }
            - Range: { min: -60, max: 60, groups: [create, edit] }
        precipitation:
            - NotBlank: { groups: [create, edit] }
            - Range: { min: 0, max: 9999.9, groups: [create, edit] }
        windSpeed:
            - NotBlank: { groups: [create, edit] }
            - Range: { min: 0, max: 999.9, groups: [create, edit] }
        pressure:
            - NotBlank: { groups: [create, edit] }
            - Range: { min: 870, max: 1085, groups: [create, edit] }
        humidity:
            - NotBlank: { groups: [create, edit] }
            - Range: { min: 0, max: 100, groups: [create, edit] }


